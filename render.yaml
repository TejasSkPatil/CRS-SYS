services:
  - type: web
    name: crm-backend
    runtime: docker
    repo: https://github.com/TejasSkPatil/CRS-SYS
    branch: main
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        placeholder: "Enter production Neon connection string (pooled)"
      - key: DB_HOST
        placeholder: "Enter Neon DB host address"
      - key: DB_PORT
        value: 5432
      - key: DB_USERNAME
        placeholder: "Enter Neon DB username"
      - key: DB_PASSWORD
        placeholder: "Enter Neon DB password"
      - key: DB_DATABASE
        placeholder: "Enter Neon DB name"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1d
